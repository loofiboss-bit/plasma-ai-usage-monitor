name: Package
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: ${{ github.workflow }}-package-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  artifacts:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container: fedora:44
    steps:
      - run: dnf install -y git python3 tar gzip
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: mkdir -p dist && SOURCE_DATE_EPOCH=$(git log -1 --format=%ct) bash scripts/package_source_tarball.sh --output-dir dist
      - run: SOURCE_DATE_EPOCH=$(git log -1 --format=%ct) bash scripts/package_plasmoid.sh --output-dir dist
      - run: python3 scripts/check_package_payload.py
      - run: cd dist && sha256sum * > SHA256SUMS.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          retention-days: 7
          name: source-and-frontend-packages
          path: dist/
          if-no-files-found: error
