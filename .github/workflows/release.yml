name: Release
on:
  push:
    tags: ['v*.*.*']
permissions:
  contents: write
jobs:
  exact-tag-artifacts:
    environment: release
    runs-on: ubuntu-latest
    container: fedora:44
    steps:
      - run: dnf install -y git python3 tar gzip gh
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: { fetch-depth: 0 }
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: bash scripts/verify_exact_tag.sh "$GITHUB_REF_NAME"
      - run: mkdir -p dist && SOURCE_DATE_EPOCH=$(git log -1 --format=%ct) bash scripts/package_source_tarball.sh --output-dir dist
      - run: SOURCE_DATE_EPOCH=$(git log -1 --format=%ct) bash scripts/package_plasmoid.sh --output-dir dist
      - run: python3 scripts/generate_source_sbom.py --tag "$GITHUB_REF_NAME" --output dist/source.spdx.json
      - run: cd dist && sha256sum * > SHA256SUMS.txt
      - name: Create exact-commit draft release
        shell: bash
        run: |
          release_args=(--verify-tag --draft --generate-notes)
          if [[ "$GITHUB_REF_NAME" != "v$(cat VERSION)" ]]; then
            release_args+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" "${release_args[@]}" dist/*
        env: { GH_TOKEN: '${{ github.token }}' }
