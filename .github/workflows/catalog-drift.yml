name: Catalog evidence drift

on:
  schedule:
    - cron: '23 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-catalog-drift-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  audit:
    permissions:
      contents: read
      issues: write
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { fetch-depth: 1, persist-credentials: false }
      - id: drift
        name: Audit catalog and official sources
        shell: bash
        run: |
          set +e
          python3 scripts/check_catalog_drift.py --network --strict-actionable-review \
            --format markdown --output catalog-drift-report.md
          status=$?
          python3 scripts/check_subscription_drift.py --strict-actionable-review \
            --output subscription-drift-report.md
          subscription_status=$?
          cat subscription-drift-report.md >> catalog-drift-report.md
          if [[ "$subscription_status" != "0" ]]; then status=1; fi
          echo "status=${status}" >> "$GITHUB_OUTPUT"
          exit 0
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          retention-days: 7
          name: provider-catalog-drift-report
          path: |
            catalog-drift-report.md
            subscription-drift-report.md
          if-no-files-found: error
      - name: Update the single maintainer issue
        if: steps.drift.outputs.status != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          title="Provider catalog drift requires review"
          number="$(gh issue list --state open --search "${title} in:title" --json number --jq '.[0].number')"
          if [[ -n "$number" ]]; then
            gh issue edit "$number" --title "$title" --body-file catalog-drift-report.md
          else
            gh issue create --title "$title" --body-file catalog-drift-report.md
          fi
      - name: Close a recovered maintainer issue
        if: steps.drift.outputs.status == '0'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          number="$(gh issue list --state open --search "Provider catalog drift requires review in:title" --json number --jq '.[0].number')"
          if [[ -n "$number" ]]; then
            gh issue close "$number" --comment "The scheduled catalog audit found no actionable catalog drift."
          fi
