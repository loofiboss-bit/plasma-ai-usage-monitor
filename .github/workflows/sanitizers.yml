name: Sanitizers
on:
  pull_request:
  schedule:
    - cron: '17 3 * * 2'
permissions:
  contents: read
jobs:
  asan-ubsan:
    runs-on: ubuntu-latest
    container: fedora:44
    steps:
      - run: dnf install -y git cmake ninja-build gcc-c++ libasan libubsan extra-cmake-modules qt6-qtbase-devel qt6-qtdeclarative-devel libplasma-devel kf6-kcoreaddons-devel kf6-kpackage-devel kf6-kwallet-devel kf6-ki18n-devel kf6-knotifications-devel openssl-devel protobuf-compiler protobuf-devel
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: cmake --preset sanitizers && cmake --build --preset sanitizers
      - run: ctest --preset sanitizers
