name: Static
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  static:
    runs-on: ubuntu-latest
    container: fedora:44
    steps:
      - run: dnf install -y git python3 bash just appstream rpmlint ShellCheck
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - run: just check
      - run: appstreamcli validate com.github.loofi.aiusagemonitor.metainfo.xml
      - run: rpmlint plasma-ai-usage-monitor.spec
      - run: shellcheck scripts/*.sh scripts/demo/*.sh
